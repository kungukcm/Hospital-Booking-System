services:
  - type: web
    name: kutrrh-assistant-api
    runtime: python
    plan: standard
    pythonVersion: 3.11.9
    buildCommand: pip install -r requirements-render.txt
    startCommand: uvicorn backend_api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    disk:
      name: kutrrh-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        generateValue: true

  - type: web
    name: kutrrh-public-frontend
    runtime: python
    plan: free
    pythonVersion: 3.11.9
    buildCommand: pip install -r requirements-render.txt
    startCommand: streamlit run frontend_app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    healthCheckPath: /healthz
    envVars:
      - key: BACKEND_URL
        value: https://kutrrh-assistant-api.onrender.com

  - type: web
    name: kutrrh-admin-dashboard
    runtime: python
    plan: free
    pythonVersion: 3.11.9
    buildCommand: pip install -r requirements-render.txt
    startCommand: streamlit run admin_dashboard.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    healthCheckPath: /healthz
    envVars:
      - key: BACKEND_URL
        value: https://kutrrh-assistant-api.onrender.com
